<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Big Bang · Administration</title>
<style>
@font-face{font-family:Outfit;src:url(assets/fonts/Outfit-Regular.ttf);font-weight:400}
@font-face{font-family:Outfit;src:url(assets/fonts/Outfit-Bold.ttf);font-weight:700}
@font-face{font-family:Unbounded;src:url(assets/fonts/Unbounded-Black.ttf);font-weight:900}
:root{--bg:#0F0D1E;--card:#19162d;--line:#2d2950;--tx:#F3EEDF;--mut:#a9a4c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.4 Outfit,system-ui,sans-serif;padding:20px}
h1{font:900 22px Unbounded,Outfit;margin:0}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#100e22;color:var(--tx);cursor:pointer;font-weight:700}
.btn.on{background:#E5372A;border-color:#E5372A}
.btn.ok{background:#1f8a4c;border-color:#1f8a4c}.btn.no{background:#7a3030;border-color:#7a3030}
#login{max-width:340px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:12px}
#login input{padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:#100e22;color:var(--tx)}
#app{display:none}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.pending{border-color:#E8B020}
.ph{aspect-ratio:4/5;background:#100e22 center/cover no-repeat}
.body{padding:12px;display:grid;gap:8px}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mut)}
.body input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#100e22;color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px}.acts .btn{flex:1;padding:8px}
.msg{max-width:1100px;margin:0 auto 12px;color:var(--mut)}
.err{color:#ff8c82;margin:0}
a{color:#9fb8ff}
</style>
</head>
<body>
<form id="login">
  <h1>ADMIN</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username" required>
  <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
  <p class="err" id="lerr"></p>
  <button class="btn on" type="submit">Se connecter</button>
</form>

<div id="app">
  <header>
    <h1>PROFILS</h1>
    <div class="bar" id="filters">
      <button class="btn on" data-f="pending">À valider <span id="nP"></span></button>
      <button class="btn" data-f="approved">Validés <span id="nA"></span></button>
      <button class="btn" data-f="all">Tous</button>
    </div>
    <div class="bar"><a class="btn" href="join.html" target="_blank">Formulaire</a><a class="btn" href="index.html" target="_blank">Présentation</a><button class="btn" id="out">Déconnexion</button></div>
  </header>
  <p class="msg" id="msg"></p>
  <div class="grid" id="grid"></div>
</div>

<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const CFG=window.BIGBANG||{};CFG.SUPABASE_URL=String(CFG.SUPABASE_URL||'').trim().replace(/\/(rest|auth|storage)\/.*$/,'').replace(/\/+$/,'');CFG.SUPABASE_KEY=String(CFG.SUPABASE_KEY||'').trim();
const API=CFG.SUPABASE_URL;
let token=sessionStorage.getItem('bb-token')||'';
let rows=[],filter='pending';
const NAMES={gn7:'GN7 GEEKS',gdg:'GDG ON CAMPUS',aws:'AWS CLOUD CLUBS'},GRP={bur:'Bureau 2026–27',out:'Bureau sortant',par:'Parrain'};
const H=(x)=>Object.assign({apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+token},x||{});
const photo=p=>p?`${API}/storage/v1/object/public/photos/${p}`:'';

$('#login').addEventListener('submit',async e=>{
  e.preventDefault();$('#lerr').textContent='';
  try{
    const r=await fetch(`${API}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:CFG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});
    const j=await r.json();if(!r.ok||!j.access_token)throw 0;
    token=j.access_token;sessionStorage.setItem('bb-token',token);start();
  }catch(x){$('#lerr').textContent='Connexion refusée.'}
});
$('#out').onclick=()=>{sessionStorage.removeItem('bb-token');location.reload()};
$('#filters').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;[...$('#filters').children].forEach(x=>x.classList.toggle('on',x===b));render()};

async function api(path,opt){
  const r=await fetch(API+path,Object.assign({},opt,{headers:H(opt&&opt.headers)}));
  if(r.status===401){sessionStorage.removeItem('bb-token');location.reload();throw 0}
  if(!r.ok)throw new Error(await r.text());
  return r;
}
async function load(){
  const r=await api('/rest/v1/members?select=*&order=created_at.desc');
  rows=await r.json();render();
}
async function patch(id,body){
  await api('/rest/v1/members?id=eq.'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});
  Object.assign(rows.find(r=>r.id===id),body);updateCounts();
}
function updateCounts(){$('#nP').textContent='('+rows.filter(r=>!r.approved).length+')';$('#nA').textContent='('+rows.filter(r=>r.approved).length+')'}
function render(){
  updateCounts();
  const g=$('#grid');g.innerHTML='';
  const list=rows.filter(r=>filter==='all'||(filter==='pending'?!r.approved:r.approved));
  $('#msg').textContent=list.length?'':'Aucun profil dans cette liste.';
  list.forEach(r=>{
    const c=document.createElement('div');c.className='card'+(r.approved?'':' pending');
    const ph=document.createElement('div');ph.className='ph';if(r.photo_path)ph.style.backgroundImage=`url("${photo(r.photo_path)}")`;
    const b=document.createElement('div');b.className='body';
    const tag=document.createElement('div');tag.className='tag';tag.textContent=NAMES[r.club]+' · '+GRP[r.grp]+(r.approved?' · ✔':' · EN ATTENTE');
    const mk=(k,ph_)=>{const i=document.createElement('input');i.value=r[k]||'';i.placeholder=ph_;i.maxLength=60;i.onchange=()=>{const v=i.value.trim();if(!v){i.value=r[k];return}patch(r.id,{[k]:v}).catch(()=>alert('Échec de la sauvegarde'))};return i};
    const two=document.createElement('div');two.className='two';two.append(mk('first_name','Prénom'),mk('last_name','Nom'));
    const slot=document.createElement('input');slot.type='number';slot.min=1;slot.max=r.grp==='par'?3:12;slot.placeholder='Position (auto)';slot.title='Position sur la slide (1 = première carte). Vide = automatique.';
    slot.value=r.slot==null?'':r.slot+1;
    slot.onchange=()=>{const v=slot.value===''?null:Math.max(0,Math.min(11,parseInt(slot.value,10)-1));patch(r.id,{slot:v}).catch(()=>alert('Échec de la sauvegarde'))};
    const a=document.createElement('div');a.className='acts';
    const ap=document.createElement('button');ap.className='btn '+(r.approved?'':'ok');ap.textContent=r.approved?'Retirer':'Approuver';
    ap.onclick=async()=>{try{await patch(r.id,{approved:!r.approved});render()}catch(x){alert('Échec')}};
    const del=document.createElement('button');del.className='btn no';del.textContent='Supprimer';
    del.onclick=async()=>{if(!confirm('Supprimer définitivement ce profil ?'))return;
      try{await api('/rest/v1/members?id=eq.'+r.id,{method:'DELETE'});
        if(r.photo_path)try{await api('/storage/v1/object/photos/'+r.photo_path,{method:'DELETE'})}catch(_){}
        rows=rows.filter(x=>x.id!==r.id);render()}catch(x){alert('Échec')}};
    a.append(ap,del);b.append(tag,two,mk('role','Poste'),slot,a);c.append(ph,b);g.appendChild(c);
  });
}
function start(){$('#login').style.display='none';$('#app').style.display='block';load().catch(()=>{})}
if(token)start();
</script>
</body>
</html>
